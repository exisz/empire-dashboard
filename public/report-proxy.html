<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Loading Playwright report…</title>
  <style>
    html,body{margin:0;min-height:100%;background:#09090b;color:#fafafa;color-scheme:dark;font:13px/1.4 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .box{max-width:720px;margin:48px auto;padding:18px;border:1px solid #3f3f46;border-radius:12px;background:#111113}
    code{color:#bfdbfe;word-break:break-all}
  </style>
</head>
<body>
  <div class="box">Preparing Playwright report…</div>
  <script>
    const report = new URLSearchParams(location.search).get('report');
    async function boot() {
      if (!report) throw new Error('Missing report URL');
      if (!('serviceWorker' in navigator)) throw new Error('Service Worker is not available');
      const registration = await navigator.serviceWorker.register('./report-sw.js', { scope: './' });
      await navigator.serviceWorker.ready;
      if (!navigator.serviceWorker.controller) {
        location.reload();
        return;
      }
      location.replace(`./report-proxy?report=${encodeURIComponent(report)}`);
    }
    boot().catch(error => {
      document.body.innerHTML = `<div class="box"><strong>Report proxy failed</strong><p>${String(error.message || error)}</p><code>${report || ''}</code></div>`;
    });
  </script>
</body>
</html>
