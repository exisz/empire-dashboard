<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Playwright Report Frame</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #09090b; color: #fafafa; color-scheme: dark; }
    body { font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .frame-error { max-width: 720px; margin: 48px auto; padding: 18px; border: 1px solid #3f3f46; border-radius: 12px; background: #111113; }
    code { color: #bfdbfe; }
  </style>
</head>
<body>
  <div class="frame-error">Loading Playwright report…</div>
  <script>
    const params = new URLSearchParams(location.search);
    const reportUrl = params.get('report');

    function fail(message) {
      document.body.innerHTML = `<div class="frame-error"><strong>Report frame failed</strong><p>${message}</p><code>${reportUrl || ''}</code></div>`;
    }

    function inject(html, url) {
      const baseHref = url.replace(/[^/]*$/, '');
      const prelude = `
        <base href="${baseHref}">
        <meta name="color-scheme" content="dark">
        <script>
          try {
            localStorage.setItem('theme', 'dark-mode');
            document.documentElement.classList.remove('light-mode');
            document.documentElement.classList.add('dark-mode');
            document.documentElement.style.colorScheme = 'dark';
          } catch (e) {}
        <\/script>
        <style>
          html, body { background: #09090b !important; color-scheme: dark !important; }
        </style>`;
      return html.replace(/<head([^>]*)>/i, `<head$1>${prelude}`);
    }

    if (!reportUrl) fail('Missing report URL.');
    else fetch(reportUrl, { cache: 'no-store' })
      .then(response => response.ok ? response.text() : Promise.reject(new Error(`HTTP ${response.status}`)))
      .then(html => {
        document.open();
        document.write(inject(html, reportUrl));
        document.close();
      })
      .catch(error => fail(String(error)));
  </script>
</body>
</html>
