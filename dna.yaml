# DNA — Fleetdeck

goal: >
  Operate the Fleetdeck at https://projects.rollersoft.com.au as a crucial
  empire middleware surface for E2E observability. It aggregates official
  Playwright reports and machine-readable status artifacts across empire products
  so regressions are visible from one operations console.

boundary:
  - Do not own the product-under-test code; surface failures and link to the owning repo/action.
  - Do not replace official Playwright HTML reports; embed them and preserve their native navigation.
  - Do not add product surfaces without registry entries that point to durable report/status artifacts.
  - Do not make white/light embedded reports the default inside the dark Fleetdeck Operations shell.

tools:
  - Vite + React dashboard in src/main.jsx and src/styles.css
  - modules/e2e/projects.json registry for products and surfaces
  - scripts/validate-registry.js for schema validation
  - GitHub Pages deployment via .github/workflows/pages.yml
  - Official Playwright HTML reports embedded in iframe panels

philosophy:
  - artifact-is-the-test
  - quality-over-quantity

conventions:
  - id: embedded-report-theme-coherence
    rule: >
      Embedded official reports must visually follow the Fleetdeck shell.
      Prefer a srcdoc report proxy that fetches official Playwright HTML, injects a
      dark-mode prelude before Playwright boots, and preserves native Playwright
      navigation. Fall back to direct iframe only when the report cannot be fetched.
    derives-from: artifact-is-the-test
